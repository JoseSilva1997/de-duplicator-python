[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guest_list_deduplicator"
version = "0.1.0"
description = "Deduplicates a guest contact list against a confirmed attendees list."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jose Silva" }]
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.7",
    "openpyxl>=3.1",
    "xlrd==2.0.1",
    "rapidfuzz>=3.9",
    "qtawesome>=1.3",
    "pyqtdarktheme>=2.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.10",
]

[project.scripts]
guest-list-dedup = "guest_list_deduplicator.app:main"

[project.gui-scripts]
guest-list-dedup-gui = "guest_list_deduplicator.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guest_list_deduplicator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
