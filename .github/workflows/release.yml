name: Build and release

# Manually triggered from the Actions tab. You pick the bump size; the pipeline
# bumps the version in pyproject.toml, builds the Windows MSI, commits the bump,
# tags it, and publishes a GitHub release with the MSI attached.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Required so the workflow can push the version-bump commit/tag and create a release.
permissions:
  contents: write

# Stop two release runs from racing each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyqtdarktheme 2.1 requires Python <3.12, so the build is pinned to 3.11.
          python-version: "3.11"

      # Compute the new version and write it back to pyproject.toml. Done before
      # the build so a build failure leaves nothing committed or tagged.
      - name: Bump version
        id: bump
        shell: python
        run: |
          import os, re, tomllib, pathlib

          bump = "${{ inputs.bump }}"
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          current = tomllib.loads(text)["project"]["version"]

          major, minor, patch = (int(part) for part in current.split("."))
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new = f"{major}.{minor}.{patch}"

          text = re.sub(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{new}"', text, count=1)
          path.write_text(text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={new}\n")
          print(f"{current} -> {new}")

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # --onedir (not --onefile): produces a real dist/Guest List Cleaner/ folder
      # that WiX lays down into Program Files. --onefile re-extracts to a temp dir
      # on every launch, which is wrong for a managed per-machine install.
      - name: Build executable
        run: >
          pyinstaller --name "Guest List Cleaner" --onedir --windowed
          --icon "src/assets/cut_duplicates_icon_256.ico"
          --add-data "src/assets/cut_duplicates_icon_256.ico;assets"
          --collect-all qtawesome
          --collect-all qdarktheme
          run.py

      # WiX 5 (last fee-free line) builds the MSI. Done before the commit/tag so
      # an MSI build failure leaves nothing committed or tagged.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build MSI
        shell: bash
        run: |
          version="${{ steps.bump.outputs.version }}"
          harvest="$(pwd)/dist/Guest List Cleaner"
          wix build "installer/GuestListCleaner.wxs" \
            -d Version="${version}" \
            -d HarvestDir="${harvest}" \
            -o "dist/Guest List Cleaner v${version}.msi"

      # The next three steps test the MSI itself: a silent per-machine install,
      # running the installed exe from Program Files, then a silent uninstall.
      # They share the msi/install paths via $GITHUB_ENV because PowerShell
      # variables don't persist across steps. GitHub's Windows runners are
      # elevated, so a perMachine install needs no UAC interaction. Exit code
      # 3010 (reboot requested) counts as success alongside 0 throughout.
      - name: Install MSI silently
        run: |
          $version = "${{ steps.bump.outputs.version }}"
          $msi = ".\dist\Guest List Cleaner v$version.msi"
          $installFolder = "C:\Program Files\Guest List Cleaner"
          $installed = "$installFolder\Guest List Cleaner.exe"

          # -PassThru + WaitForExit, not -Wait: -Wait blocks on descendants too,
          # and the Windows Installer service (msiexec /V) lingers idle for ~10
          # minutes after the install, which would hang this step that whole time.
          $i = Start-Process msiexec -ArgumentList "/i","$msi","/qn","/l*v","install.log" -PassThru
          if (-not $i.WaitForExit(300000)) {
            $i.Kill()
            if (Test-Path install.log) { Get-Content install.log -Tail 50 }
            throw "Silent install timed out."
          }
          if ($i.ExitCode -ne 0 -and $i.ExitCode -ne 3010) {
            if (Test-Path install.log) { Get-Content install.log -Tail 50 }
            throw "Silent install failed with exit code $($i.ExitCode)."
          }
          # Confirms the all-users layout: the exe landed under Program Files.
          if (-not (Test-Path $installed)) { throw "Installed exe not found at $installed." }

          # Hand the paths to the later steps (fresh shell each step).
          "MSI_PATH=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALL_FOLDER=$installFolder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLED_EXE=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Always upload the verbose msiexec log, even on a timeout or failure, so
      # a hang can be diagnosed (e.g. install genuinely blocked vs. succeeded).
      # if-no-files-found: ignore so an early build failure doesn't error here.
      - name: Upload MSI install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-install-log
          path: install.log
          if-no-files-found: ignore

      - name: Run installed app
        run: |
          # --windowed, so a crash raises a modal dialog that never returns;
          # WaitForExit turns that hang into a failure.
          $p = Start-Process -FilePath "$env:INSTALLED_EXE" -ArgumentList "--self-check" -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            throw "Installed app self-check timed out (likely a missing bundled dependency)."
          }
          if ($p.ExitCode -ne 0) { throw "Installed app self-check failed with exit code $($p.ExitCode)." }

      - name: Uninstall MSI silently
        run: |
          # -PassThru + WaitForExit, not -Wait (see the install step for why).
          $u = Start-Process msiexec -ArgumentList "/x","$env:MSI_PATH","/qn" -PassThru
          if (-not $u.WaitForExit(300000)) {
            $u.Kill()
            throw "Silent uninstall timed out."
          }
          if ($u.ExitCode -ne 0 -and $u.ExitCode -ne 3010) { throw "Silent uninstall failed with exit code $($u.ExitCode)." }
          if (Test-Path "$env:INSTALL_FOLDER") { throw "Uninstall left files behind." }

      # Only reached if the build succeeded.
      - name: Commit bump and tag
        shell: bash
        run: |
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release v${version}"
          git tag "v${version}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${version}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          gh release create "v${version}" \
            "dist/Guest List Cleaner v${version}.msi" \
            --title "Guest List Cleaner v${version}" \
            --generate-notes
