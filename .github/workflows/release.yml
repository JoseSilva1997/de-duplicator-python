name: Build and release

# Manually triggered from the Actions tab. You pick the bump size; the pipeline
# bumps the version in pyproject.toml, builds the Windows .exe, commits the bump,
# tags it, and publishes a GitHub release with the executable attached.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Required so the workflow can push the version-bump commit/tag and create a release.
permissions:
  contents: write

# Stop two release runs from racing each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compute the new version and write it back to pyproject.toml. Done before
      # the build so a build failure leaves nothing committed or tagged.
      - name: Bump version
        id: bump
        shell: python
        run: |
          import os, re, tomllib, pathlib

          bump = "${{ inputs.bump }}"
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          current = tomllib.loads(text)["project"]["version"]

          major, minor, patch = (int(part) for part in current.split("."))
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new = f"{major}.{minor}.{patch}"

          text = re.sub(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{new}"', text, count=1)
          path.write_text(text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={new}\n")
          print(f"{current} -> {new}")

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build executable
        run: >
          pyinstaller --name "Guest List Cleaner" --onefile --windowed
          --icon "src/assets/cut_duplicates_icon_256.ico"
          --add-data "src/assets/cut_duplicates_icon_256.ico;assets"
          --collect-all qtawesome
          --collect-all qdarktheme
          run.py

      # Only reached if the build succeeded.
      - name: Commit bump and tag
        shell: bash
        run: |
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release v${version}"
          git tag "v${version}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${version}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          gh release create "v${version}" \
            "dist/Guest List Cleaner.exe" \
            --title "Guest List Cleaner v${version}" \
            --generate-notes
